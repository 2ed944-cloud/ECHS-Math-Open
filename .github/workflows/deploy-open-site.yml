name: Deploy ECHS Mathematics Open

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-open
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out latest canonical platform
        uses: actions/checkout@v4
        with:
          repository: 2ed944-cloud/ECHS-Math
          ref: main
          fetch-depth: 0
          path: source

      - name: Overlay reviewed open-edition exporter
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git fetch origin agent/open-platform-export:refs/remotes/origin/agent/open-platform-export
          git checkout origin/agent/open-platform-export -- \
            tools/build_open_site.py \
            tools/test_open_site_contract.py \
            variants/open \
            js/portal-open.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build account-free site
        run: python source/tools/build_open_site.py source site

      - name: Validate absence of accounts and school services
        run: python source/tools/test_open_site_contract.py site

      - name: Remove build-only files
        shell: bash
        run: |
          rm -rf site/.github site/tools
          test -f site/index.html
          test -f site/open-build.json
          test -d site/lessons
          test -f site/question-bank/practice.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy open site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live account-free platform
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          lesson="lessons/ap-calculus/unit-1/1-1-can-change-occur-at-an-instant.html"
          for attempt in $(seq 1 30); do
            index_status="$(curl -L --silent --show-error --header 'Cache-Control: no-cache' -o /tmp/open-index.html -w '%{http_code}' "${base}/index.html?attempt=${attempt}" || true)"
            meta_status="$(curl -L --silent --show-error --header 'Cache-Control: no-cache' -o /tmp/open-build.json -w '%{http_code}' "${base}/open-build.json?attempt=${attempt}" || true)"
            practice_status="$(curl -L --silent --show-error --header 'Cache-Control: no-cache' -o /tmp/open-practice.html -w '%{http_code}' "${base}/question-bank/practice.html?attempt=${attempt}" || true)"
            lesson_status="$(curl -L --silent --show-error --header 'Cache-Control: no-cache' -o /tmp/open-lesson.html -w '%{http_code}' "${base}/${lesson}?attempt=${attempt}" || true)"

            if [[ "$index_status" == "200" && "$meta_status" == "200" && "$practice_status" == "200" && "$lesson_status" == "200" ]] \
              && grep -q "ECHS Mathematics Open" /tmp/open-index.html \
              && grep -q '"edition": "open"' /tmp/open-build.json \
              && grep -q '"accounts": false' /tmp/open-build.json \
              && grep -q '"roles": false' /tmp/open-build.json \
              && ! grep -qiE "Sign in|School Control Center|data-require-account|Supabase" /tmp/open-index.html \
              && ! grep -qiE "data-require-account|lesson-access-guard|institution-client|Supabase" /tmp/open-practice.html \
              && ! grep -qiE "data-echs-lesson-guard|lesson-access-guard|institution-client|Supabase" /tmp/open-lesson.html; then
              echo "ECHS Mathematics Open live verification: PASS"
              exit 0
            fi

            echo "Attempt ${attempt}: index=${index_status}, metadata=${meta_status}, practice=${practice_status}, lesson=${lesson_status}"
            sleep 10
          done

          echo "Live account-free platform verification failed." >&2
          echo "Index preview:" >&2
          head -c 600 /tmp/open-index.html >&2 || true
          echo >&2
          echo "Metadata preview:" >&2
          cat /tmp/open-build.json >&2 || true
          exit 1

  report:
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment result
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = "deployment-status.json";
            const payload = {
              platform: "ECHS Mathematics Open",
              account_free: true,
              build: process.env.BUILD_RESULT,
              deploy: process.env.DEPLOY_RESULT,
              run_id: context.runId,
              source_repository: "2ed944-cloud/ECHS-Math",
              source_ref: "main plus reviewed open exporter",
              site_url: "https://2ed944-cloud.github.io/ECHS-Math-Open/",
              recorded_at: new Date().toISOString()
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "Record open-site deployment status [skip ci]",
              content: Buffer.from(JSON.stringify(payload, null, 2) + "\n").toString("base64"),
              sha
            });
