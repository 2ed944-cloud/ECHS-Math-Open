name: Validate ECHS Question Bank

on:
  push:
    paths:
      - 'question-bank/official/**'
      - 'js/official-ap-integration.js'
      - '.github/workflows/echs-ap-bank-validate.yml'
  pull_request:
    paths:
      - 'question-bank/official/**'
      - 'js/official-ap-integration.js'
      - '.github/workflows/echs-ap-bank-validate.yml'

permissions:
  contents: read

jobs:
  validate-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned validation dependencies
        run: npm ci --prefix question-bank/official/tools
      - name: Validate cumulative teacher audit overlays
        id: overlay
        continue-on-error: true
        run: npm run validate:overlays --prefix question-bank/official/tools
      - name: Upload overlay validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-overlay-validation
          path: |
            question-bank/official/admin/reports/ADMIN_OVERLAY_VALIDATION.json
            question-bank/official/admin/reports/ADMIN_OVERLAY_VALIDATION.md
          if-no-files-found: error
      - name: Enforce overlay validation result
        if: steps.overlay.outcome == 'failure'
        run: exit 1

  validate:
    needs: validate-overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned validation dependencies
        run: npm ci --prefix question-bank/official/tools
      - name: Install headless Chromium
        run: npx --prefix question-bank/official/tools playwright install --with-deps chromium-headless-shell
      - name: Parse every canonical math expression
        run: npm run validate:katex --prefix question-bank/official/tools
      - name: Run browser smoke tests
        run: npm run validate:browser --prefix question-bank/official/tools
      - name: Generate deterministic release checksums
        run: python question-bank/official/tools/generate_release_checksums.py
      - name: Run the independently audited release validator
        run: python question-bank/official/tools/validate_release.py
